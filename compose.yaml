name: vwkanban

services:
  db:
    image: postgres:17.12-alpine
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=20"]
    environment:
      POSTGRES_USER: vwkanban
      POSTGRES_DB: vwkanban
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vwkanban -d vwkanban"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m
    restart: unless-stopped

  app:
    image: ghcr.io/${VWK_IMAGE_OWNER:-vwkanban}/vwkanban-app:${VWK_VERSION:-latest}
    build:
      context: backend
      dockerfile: ../docker/app.Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: vwkanban
      POSTGRES_DB: vwkanban
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/healthz', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 256m
    restart: unless-stopped

  web:
    image: ghcr.io/${VWK_IMAGE_OWNER:-vwkanban}/vwkanban-web:${VWK_VERSION:-latest}
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 32m
    restart: unless-stopped

volumes:
  pgdata:
