map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Login/signup: 5 requests per minute per client IP (a burst of 5, then 1 per 12 s).
# Behind another proxy, add set_real_ip_from + real_ip_header so this stays per client.
limit_req_zone $binary_remote_addr zone=vwk_auth:1m rate=5r/m;

upstream vwk_app {
    server app:8000;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # CSV import is capped at 5 MB by the app (its JSON 413); nginx stops anything over
    # 6 MB itself and answers with the same error envelope.
    client_max_body_size 6m;
    error_page 413 = @too_large;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location ~ ^/api/auth/(login|signup)$ {
        limit_req zone=vwk_auth burst=4 nodelay;
        limit_req_status 429;
        proxy_pass http://vwk_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://vwk_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # nginx reads a whole upload before passing it on, so a slow client never holds
        # the app (the default, stated because CSV import relies on it).
        proxy_request_buffering on;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location @too_large {
        default_type application/json;
        return 413 '{"error":{"code":"validation","message":"file is larger than 5 MB"}}';
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
